name: Publish PR 375 image to GHCR

on:
  workflow_dispatch:
  push:
    branches:
      - deploy/pr-375-image

permissions:
  contents: read
  packages: write

jobs:
  binary:
    name: Build release binary
    uses: ./.github/workflows/build-binary.yml
    with:
      profile: release
    secrets: inherit

  image:
    name: Publish linux/amd64 image
    needs: binary
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v7
        with:
          name: dec-party-manager
          path: ctx

      - name: Add runtime Dockerfile to build context
        run: cp Dockerfile ctx/Dockerfile

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push image
        id: image
        uses: docker/build-push-action@v6
        with:
          context: ctx
          platforms: linux/amd64
          push: true
          tags: ghcr.io/shibaeff/decentralization-manager:pr-375-5756296
          build-args: |
            DECPM_BUILD_VERSION=pr-375-5756296
            DECPM_BUILD_TIME=${{ github.event.repository.updated_at }}

      - name: Record immutable image reference
        run: |
          echo '### Published image' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "ghcr.io/shibaeff/decentralization-manager@${{ steps.image.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
